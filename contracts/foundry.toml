[profile.default]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
ffi = false
src = "src"
test = "test"
out = "out"
libs = ["lib"]
fs_permissions = [
  { access = "read",  path = "./test/fixtures" },
  { access = "write", path = "./deployments" },
]

[fuzz]
runs = 512

[invariant]
runs = 256
depth = 64
